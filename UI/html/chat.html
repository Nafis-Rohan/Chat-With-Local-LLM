<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
  </head>
  <body>
    <h2>Chat</h2>

    <div>
      Logged in as: <b id="who"></b>
      <button id="btnLogout">Logout</button>
      <button id="btnHistory">Go to History</button>
    </div>

    <hr />

    <div>
      <input
        id="question"
        placeholder="Type your message..."
        style="width: 400px"
      />
      <button id="btnSend">Send</button>
    </div>

    <h3>Response</h3>
    <pre id="replyBox"></pre>

    <script src="../js/chat.js"></script>
  </body>
</html>
